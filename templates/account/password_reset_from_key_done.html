{% extends "allauth/layouts/base.html" %}
{% comment %}Shown after the new password is saved from a reset link.{% endcomment %}
{% block head_title %}Password updated{% endblock %}
{% block content %}
  <div class="auth-head">
    <h1 class="auth-title">Password updated</h1>
    <p class="auth-sub">Your password has been changed. You can now <a href="{% url 'account_login' %}">sign in</a>.</p>
  </div>
{% endblock %}
